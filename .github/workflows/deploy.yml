name: Deploy to GitHub Pages

# Builds the Vite site and publishes it to GitHub Pages via the official
# Pages Actions (no gh-pages branch needed).
#
# One workflow, one gate. Dependabot's auto-merge used to live in verify.yml,
# whose `verify` job ran the unit tests, the build and the e2e suite but not the
# `test:a11y` Playwright pass (claims, hidden-attribute and axe) that this
# file's build job runs before deploying. A bump could clear the lighter gate,
# merge itself, and then fail here on main where no pull request is watching.
# The auto-merge now needs the SAME `build` job `deploy` needs, and verify.yml
# is deleted: every command it ran is in that job.
#
# Three triggers, each load-bearing:
#   push          - ship main.
#   pull_request  - the gate judges PRs, so auto-merge has something to wait on.
#   workflow_dispatch - a merge made with GITHUB_TOKEN raises no push event, so
#                   the auto-merge job dispatches this workflow explicitly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deployment at a time per ref. Keyed by ref, NOT a
# bare `pages`: now that pull_request is a trigger, a PR run must not share a
# group with a live main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: |
          npm test
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # scripts/e2e.test.mjs — the browser regression suite. It ran only in
      # verify.yml, whose header justified the split as "so a flaky browser
      # install can't block publishing"; that stopped being true the moment
      # this job started installing Chromium for the step below. It is the only
      # thing that exercises `npm run verify`, the offline transcript verifier
      # the README promises, and the accounting identities the page renders.
      - name: Browser regression suite (built preview)
        run: |
          npm run preview -- --port 4675 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4675/crypto-lab-jevil/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:4675/crypto-lab-jevil/ npm run test:e2e

      # `test:a11y` is bare `playwright test`, so this also runs claims.spec.ts
      # and hidden-attribute.spec.ts, not just the axe pass.
      - name: Browser claims and accessibility gate
        run: npm run test:a11y

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # A pull request is gated, never published. NOT `== 'push'`: that would
    # also skip workflow_dispatch, which the post-merge dispatch depends on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
