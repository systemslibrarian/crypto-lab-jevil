name: Deploy to GitHub Pages

# Builds the Vite site and publishes it to GitHub Pages via the official
# Pages Actions (no gh-pages branch needed). Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deployment at a time; let a newer run supersede.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: |
          npm test
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # scripts/e2e.test.mjs — the browser regression suite. It ran only in
      # verify.yml, whose header justified the split as "so a flaky browser
      # install can't block publishing"; that stopped being true the moment
      # this job started installing Chromium for the step below. It is the only
      # thing that exercises `npm run verify`, the offline transcript verifier
      # the README promises, and the accounting identities the page renders.
      - name: Browser regression suite (built preview)
        run: |
          npm run preview -- --port 4675 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4675/crypto-lab-jevil/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:4675/crypto-lab-jevil/ npm run test:e2e

      # `test:a11y` is bare `playwright test`, so this also runs claims.spec.ts
      # and hidden-attribute.spec.ts, not just the axe pass.
      - name: Browser claims and accessibility gate
        run: npm run test:a11y

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
